# Pages whose shell the backend fills with per-route head tags and a text summary (PageController).
# Included before a `rewrite ... break` to the backend's /pages/... path, so the browser only ever
# sees the clean URL. A 404 passes through (the backend still sends the shell, so React renders its
# not-found page); if the backend is down, failing or rate limiting, the static shell is served
# instead, so the app never breaks because of this.
include /etc/nginx/security-headers.conf;
add_header Cache-Control "no-cache" always;
set $backend http://backend:8080;
proxy_pass $backend;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $fwd_proto;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Port $fwd_port;
# Never pass a client's own copy: Spring reads Forwarded before X-Forwarded-For (see nginx.conf).
proxy_set_header Forwarded "";
proxy_set_header X-Forwarded-Prefix "";
proxy_read_timeout 10s;
# The page's own headers (above) replace Spring Security's API defaults instead of doubling them.
proxy_hide_header Cache-Control;
proxy_hide_header Pragma;
proxy_hide_header Expires;
proxy_hide_header X-Frame-Options;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header X-XSS-Protection;
proxy_hide_header Referrer-Policy;
proxy_hide_header Strict-Transport-Security;
proxy_intercept_errors on;
error_page 429 500 502 503 504 = /index.html;
