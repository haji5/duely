# Security headers for the app's own pages and assets. Included in every location that serves
# files, because an add_header inside a location cancels the ones inherited from the server block.
# API responses (/api/) carry the backend's own headers instead.
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Embedded YouTube and Spotify players may go fullscreen.
add_header Permissions-Policy 'geolocation=(), microphone=(), camera=(), fullscreen=(self "https://www.youtube.com" "https://www.youtube-nocookie.com" "https://open.spotify.com")' always;
# Browsers only honour HSTS on https responses (e.g. through the Cloudflare tunnel) and ignore it on plain http.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://apis.google.com https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; media-src 'self' https:; frame-src 'self' https://www.youtube.com https://www.youtube-nocookie.com https://open.spotify.com https://*.firebaseapp.com https://*.web.app https://accounts.google.com; connect-src 'self' https:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
