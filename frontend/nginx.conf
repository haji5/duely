pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_types text/css text/plain application/javascript text/javascript application/json application/xml application/manifest+json image/svg+xml application/font-woff2;
    etag on;

    # Docker's embedded DNS. Resolving the backend per request (see $backend below) survives
    # backend restarts with a new IP and lets nginx start before the backend exists.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Trust X-Forwarded-For only from the Cloudflare tunnel container, which has a fixed address
    # (docker-compose.local.yml). Everyone else is identified by the connecting address, so a
    # client can't choose its own rate-limit bucket. Under Docker Desktop all LAN clients arrive
    # through the same gateway address and therefore share one per-IP bucket.
    set_real_ip_from 172.29.53.250;
    real_ip_header X-Forwarded-For;

    # The scheme and port the browser used. Behind the tunnel that's https/443 (cloudflared sends
    # X-Forwarded-Proto); directly it's this server's own. Spring rebuilds the request origin from
    # these, so same-origin POSTs through the tunnel aren't mistaken for cross-origin ones. A
    # client that fakes the header can only make its own request look same-origin to itself, and
    # auth is a bearer token, so this grants nothing.
    map $http_x_forwarded_proto $fwd_proto {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }
    map $fwd_proto $fwd_port {
        https   443;
        default $server_port;
    }

    server {
        listen 3000;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Fingerprinted build output: cache forever. No `always`, so a 404 (e.g. an old chunk
        # after a deploy) isn't cached for a year.
        location /assets/ {
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        # Everything else (index.html, favicon, manifest, theme-init.js): revalidate each time so
        # a new deployment takes effect immediately; ETags keep that cheap.
        location = /index.html {
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "no-cache" always;
            try_files $uri =404;
        }

        # Home, brackets and results: the shell with per-route head tags from the backend
        # (page-proxy.conf). The include comes first because its `set` would be skipped after a
        # `rewrite ... break`; named captures because the rewrite's own match resets $1/$2.
        location = / {
            include /etc/nginx/page-proxy.conf;
            rewrite ^ /pages/home break;
        }

        location ~ ^/(?<page>bracket|results)/(?<page_id>\d+)$ {
            include /etc/nginx/page-proxy.conf;
            rewrite ^ /pages/$page/$page_id break;
        }

        # Generated by the backend from the database, with numbered parts behind an index once it
        # outgrows one file; crawlers may cache them for an hour.
        location ~ ^/sitemap(-[0-9]+)?\.xml$ {
            set $backend http://backend:8080;
            proxy_pass $backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $fwd_proto;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $fwd_port;
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-Prefix "";
            proxy_hide_header Cache-Control;
            proxy_hide_header Pragma;
            proxy_hide_header Expires;
            add_header Cache-Control "public, max-age=3600";
        }

        # Other client-side routes (keep in sync with App.tsx). Only these get the SPA shell with 200.
        location ~ ^/(browse|create|about|admin)$ {
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "no-cache" always;
            try_files /index.html =404;
        }

        # Not offered (yet); answer 404 instead of falling through to the shell.
        location = /llms.txt {
            include /etc/nginx/security-headers.conf;
            return 404;
        }

        location ^~ /.well-known/ {
            include /etc/nginx/security-headers.conf;
            return 404;
        }

        # Real files from public/ (robots.txt, og.png, ...). Any other path is a 404 that still
        # renders the shell, so React's NotFoundPage shows while crawlers see the status.
        location / {
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "no-cache" always;
            error_page 404 /index.html;
            try_files $uri =404;
        }

        # Actuator is for container health checks, which call the backend directly.
        location /api/actuator/ {
            return 404;
        }

        # Pages are served at their clean URLs only (see page-proxy.conf).
        location /api/pages/ {
            return 404;
        }

        # Reverse proxy to the backend (same-origin /api, prefix stripped)
        location /api/ {
            client_max_body_size 2m;
            set $backend http://backend:8080;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass $backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # Overwrite (not append): the backend uses X-Forwarded-For as the client IP for rate
            # limiting, so a client-supplied value must never be passed through.
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $fwd_proto;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $fwd_port;
            # Spring (forward-headers-strategy=framework) reads the RFC 7239 Forwarded header before
            # X-Forwarded-*, so a client copy would let callers pick their own rate-limit address.
            # Clear it (and X-Forwarded-Prefix) here, in the sitemap location and in page-proxy.conf.
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-Prefix "";
            proxy_read_timeout 60s;
        }
    }
}
