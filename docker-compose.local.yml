# docker-compose.local.yml: LAN / Internet hosting overlay for docker-compose.yml, for playing
# with friends and demos. The Internet profile is a Cloudflare quick tunnel: a random
# trycloudflare.com host that changes on every start, with no uptime guarantee. For a stable public
# site use docker-compose.prod.yml (see "Running it publicly" in the README).
#
# Usage (automated):  .\host.ps1 start [-Internet]
# Usage (manual):     docker compose -f docker-compose.yml -f docker-compose.local.yml [--profile internet] up --build
#
# Browsers reach the app through nginx on port 3000, so API calls are same-origin, including
# through the Cloudflare tunnel (nginx forwards the tunnel's https scheme to the backend).
# CORS_ALLOWED_ORIGINS only matters for genuinely cross-origin setups, such as a Vite dev server
# on another device.

services:
  backend:
    environment:
      CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://${LAN_IP:-localhost}:3000"

  tunnel:
    image: cloudflare/cloudflared:2026.10.1
    command: tunnel --no-autoupdate --url http://frontend:3000
    restart: unless-stopped
    depends_on:
      - frontend
    profiles:
      - internet
    networks:
      bracket-battle-network:
        # nginx trusts X-Forwarded-For from this address only (TRUSTED_PROXIES in docker-compose.yml)
        ipv4_address: 172.29.53.250
