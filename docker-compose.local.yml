# docker-compose.local.yml — LAN hosting overlay
# Layers on top of docker-compose.yml to enable access from other devices on your network.
#
# Usage (automated):  .\host.ps1 start
# Usage (manual):     $env:LAN_IP="192.168.1.42"; docker-compose -f docker-compose.yml -f docker-compose.local.yml up --build
#
# NOTE: Do NOT use this file alone — it requires the base docker-compose.yml.

services:
  backend:
    environment:
      # Allow the frontend running on the LAN IP or Tunnel to make cross-origin requests
      CORS_ALLOWED_ORIGINS: "http://${LAN_IP}:3000,http://localhost:3000,${TUNNEL_URL:-}"

  frontend:
    build:
      context: ./frontend
      args:
        # Use the same /api proxy path as production (nginx handles the rewrite)
        - VITE_API_URL=/api
        # Re-pass Firebase args (required since we're overriding the build section)
        - VITE_FIREBASE_API_KEY=${VITE_FIREBASE_API_KEY}
        - VITE_FIREBASE_AUTH_DOMAIN=${VITE_FIREBASE_AUTH_DOMAIN}
        - VITE_FIREBASE_PROJECT_ID=${VITE_FIREBASE_PROJECT_ID}
        - VITE_FIREBASE_STORAGE_BUCKET=${VITE_FIREBASE_STORAGE_BUCKET}
        - VITE_FIREBASE_MESSAGING_SENDER_ID=${VITE_FIREBASE_MESSAGING_SENDER_ID}
        - VITE_FIREBASE_APP_ID=${VITE_FIREBASE_APP_ID}
        - VITE_FIREBASE_MEASUREMENT_ID=${VITE_FIREBASE_MEASUREMENT_ID}

  tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --url http://frontend:3000
    profiles:
      - internet
    networks:
      - bracket-battle-network
