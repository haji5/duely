# Weekly update PRs for every dependency manager in the repository. Minor and patch updates are
# grouped into one PR per ecosystem, so they can be reviewed and merged together; major updates
# come one by one.
version: 2
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
    groups:
      maven-minor:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      npm-minor:
        update-types: [minor, patch]

  # Base images of both Dockerfiles (nginx, node, maven, temurin).
  - package-ecosystem: docker
    directories: [/backend, /frontend]
    schedule:
      interval: weekly

  # Images in the Compose files (postgres, valkey, cloudflared).
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        update-types: [minor, patch]
