spring.application.name=bracket-battle-backend

# Database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/bracket_battle}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:30}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:10}
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.pool-name=BracketBattlePool

# Liquibase owns the schema; Hibernate only checks it
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Valkey (Redis-compatible): cache and rate-limit counters. Short timeouts so an outage costs
# little; commands are also rejected immediately while disconnected (see CacheConfig).
spring.data.redis.host=${VALKEY_HOST:localhost}
spring.data.redis.port=${VALKEY_PORT:6379}
spring.data.redis.password=${VALKEY_PASSWORD:}
spring.data.redis.timeout=500ms
spring.data.redis.connect-timeout=500ms
spring.data.redis.lettuce.pool.enabled=true
spring.data.redis.lettuce.pool.max-active=50
spring.data.redis.lettuce.pool.max-idle=20
spring.data.redis.lettuce.pool.min-idle=0
spring.data.redis.lettuce.pool.max-wait=500ms

# Browser origins allowed to call the API cross-origin (comma-separated). Same-origin requests
# through nginx, including the Cloudflare tunnel, don't need an entry.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Rate limits (fixed windows in Valkey, shared by all instances; fail open if Valkey is down)
app.rate-limit.buckets.read.limit=${READ_RATE_LIMIT:300}
app.rate-limit.buckets.read.period-seconds=${READ_RATE_PERIOD:60}
app.rate-limit.buckets.result-user.limit=${RESULT_USER_RATE_LIMIT:5}
app.rate-limit.buckets.result-user.period-seconds=60
app.rate-limit.buckets.result-ip.limit=${RESULT_IP_RATE_LIMIT:10}
app.rate-limit.buckets.result-ip.period-seconds=60
app.rate-limit.buckets.bracket-create.limit=${BRACKET_CREATION_LIMIT:10}
app.rate-limit.buckets.bracket-create.period-seconds=${BRACKET_CREATION_PERIOD:3600}
app.rate-limit.buckets.metadata-search.limit=${METADATA_SEARCH_LIMIT:600}
app.rate-limit.buckets.metadata-search.period-seconds=3600
app.rate-limit.buckets.metadata-playlist.limit=${METADATA_PLAYLIST_LIMIT:30}
app.rate-limit.buckets.metadata-playlist.period-seconds=3600

# Server (behind nginx, which sets X-Forwarded-*)
server.port=${SERVER_PORT:8080}
server.forward-headers-strategy=framework
server.max-http-request-header-size=16KB
# Pure JSON API: unknown paths are 404s, not static-resource lookups
spring.web.resources.add-mappings=false
server.error.include-stacktrace=never

# Actuator: health and info only. The readiness group ignores Valkey on purpose: the app still
# serves from Postgres without it.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db

logging.level.root=INFO
