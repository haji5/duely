spring.application.name=bracket-battle-backend
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/bracket_battle}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false

# Liquibase
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

# Redis Cache Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2000ms
spring.data.redis.connect-timeout=2000ms
spring.data.redis.client-type=lettuce

# Redis connection pool settings (Lettuce)
spring.data.redis.lettuce.pool.enabled=true
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=2
spring.data.redis.lettuce.pool.max-wait=2000ms
spring.data.redis.lettuce.shutdown-timeout=100ms

# Cache configuration
spring.cache.type=redis
spring.cache.redis.time-to-live=600000
spring.cache.redis.cache-null-values=false
spring.cache.redis.use-key-prefix=true
spring.cache.redis.key-prefix=bracket-battle:

# CORS
spring.web.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=Authorization,Cache-Control,Content-Type,X-XSRF-TOKEN
spring.web.cors.allow-credentials=true

# Server
server.port=${SERVER_PORT:8080}
server.forward-headers-strategy=framework

# Actuator
management.endpoints.web.exposure.include=health,info,caches
management.endpoint.health.probes.enabled=true
management.health.db.enabled=true
management.health.redis.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# Logging
logging.level.root=INFO
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=OFF
logging.level.com.bracketbattle=DEBUG
logging.level.com.bracketbattle.security.firebase=DEBUG
logging.level.org.springframework.cache=DEBUG
logging.level.org.springframework.data.redis=DEBUG

# Resilience4j Rate Limiter
resilience4j.ratelimiter.instances.resultSubmission.limit-for-period=5
resilience4j.ratelimiter.instances.resultSubmission.limit-refresh-period=60s
resilience4j.ratelimiter.instances.resultSubmission.timeout-duration=0s
resilience4j.ratelimiter.instances.resultSubmission.register-health-indicator=true
resilience4j.ratelimiter.instances.resultSubmission.event-consumer-buffer-size=100
