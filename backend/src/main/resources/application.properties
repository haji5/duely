spring.application.name=bracket-battle-backend

# Database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/bracket_battle}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:30}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:10}
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.pool-name=BracketBattlePool

# Liquibase owns the schema; Hibernate only checks it
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Valkey (Redis-compatible): cache and rate-limit counters. Short timeouts so an outage costs
# little; commands are also rejected immediately while disconnected (see CacheConfig).
spring.data.redis.host=${VALKEY_HOST:localhost}
spring.data.redis.port=${VALKEY_PORT:6379}
spring.data.redis.password=${VALKEY_PASSWORD:}
spring.data.redis.timeout=500ms
spring.data.redis.connect-timeout=500ms
spring.data.redis.lettuce.pool.enabled=true
spring.data.redis.lettuce.pool.max-active=50
spring.data.redis.lettuce.pool.max-idle=20
spring.data.redis.lettuce.pool.min-idle=0
spring.data.redis.lettuce.pool.max-wait=500ms

# Browser origins allowed to call the API cross-origin (comma-separated). Same-origin requests
# through nginx, including the Cloudflare tunnel, don't need an entry.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Rate limits: fixed windows in Valkey, shared by all instances. Guests count per IPv4 address or
# IPv6 /64. If Valkey is down, reads are not limited and the rest count in memory per instance.
app.rate-limit.buckets.read.limit=${READ_RATE_LIMIT:600}
app.rate-limit.buckets.read.period-seconds=${READ_RATE_PERIOD:60}
app.rate-limit.buckets.result-user.limit=${RESULT_USER_RATE_LIMIT:5}
app.rate-limit.buckets.result-user.period-seconds=60
app.rate-limit.buckets.result-ip.limit=${RESULT_IP_RATE_LIMIT:20}
app.rate-limit.buckets.result-ip.period-seconds=60
app.rate-limit.buckets.bracket-create.limit=${BRACKET_CREATION_LIMIT:10}
app.rate-limit.buckets.bracket-create.period-seconds=${BRACKET_CREATION_PERIOD:3600}
app.rate-limit.buckets.metadata-search.limit=${METADATA_SEARCH_LIMIT:600}
app.rate-limit.buckets.metadata-search.period-seconds=3600
app.rate-limit.buckets.metadata-playlist.limit=${METADATA_PLAYLIST_LIMIT:30}
app.rate-limit.buckets.metadata-playlist.period-seconds=3600
app.rate-limit.buckets.run-start-user.limit=${RUN_START_USER_RATE_LIMIT:30}
app.rate-limit.buckets.run-start-user.period-seconds=60
app.rate-limit.buckets.run-start-ip.limit=${RUN_START_IP_RATE_LIMIT:60}
app.rate-limit.buckets.run-start-ip.period-seconds=60
# Per bracket and day: runs past these are still saved (a guest's only until RunPruner deletes
# it), but no longer counted toward the leaderboard (see RunService). Every run counts against
# its address (counted-ip), signed in or not; a signed-in run also against its user
# (counted-user), so one address counts at most counted-ip runs however often its players sign
# in or out.
app.rate-limit.buckets.counted-user.limit=${COUNTED_RUNS_PER_USER:10}
app.rate-limit.buckets.counted-user.period-seconds=86400
app.rate-limit.buckets.counted-ip.limit=${COUNTED_RUNS_PER_IP:30}
app.rate-limit.buckets.counted-ip.period-seconds=86400
# Reports of brackets and comments, per signed-in user or guest address.
app.rate-limit.buckets.report.limit=${REPORT_RATE_LIMIT:5}
app.rate-limit.buckets.report.period-seconds=3600

# Run tickets: HMAC secret of at least 32 bytes. Blank means a random one per process (fine for
# development; set it when tickets must survive a restart or more than one instance runs).
app.run-ticket.secret=${RUN_TICKET_SECRET:}
# A run faster than this per match is saved but not counted; the UI takes over a second per pick.
app.runs.min-ms-per-match=400
# Hourly: delete guests' uncounted runs once their ticket has expired (RunPruner). "-" turns it off.
app.runs.prune-cron=0 15 * * * *

# Server (behind nginx, which sets X-Forwarded-*)
server.port=${SERVER_PORT:8080}
# Requests run on virtual threads, so one waiting on Postgres, Valkey or an upstream site holds no
# platform thread. What bounds the work instead: the connection pool, and UpstreamGuard for scraping.
spring.threads.virtual.enabled=true
server.forward-headers-strategy=framework
server.max-http-request-header-size=16KB
# Pure JSON API: unknown paths are 404s, not static-resource lookups
spring.web.resources.add-mappings=false
server.error.include-stacktrace=never

# Actuator on its own port, which nginx never proxies and Compose never publishes: health checks,
# and Prometheus metrics (/actuator/prometheus) for a scraper inside the Docker network. The
# readiness group ignores Valkey on purpose: the app still serves from Postgres without it.
management.server.port=${MANAGEMENT_PORT:8081}
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db

logging.level.root=INFO

# Server-rendered head tags, sitemap and robots.txt (PageController, SitemapController). The
# public origin goes into canonicals, og:url, JSON-LD, the sitemap and robots.txt; it's configured,
# never taken from the Host header. The SPA shell is fetched from the frontend container and kept
# briefly.
app.public-base-url=${PUBLIC_BASE_URL:http://localhost:3000}
# Production sets this: the backend then refuses to start unless that origin is public https.
app.require-public-origin=${REQUIRE_PUBLIC_ORIGIN:false}
app.spa-index-url=${SPA_INDEX_URL:http://frontend:3000/index.html}
app.spa-index-ttl=30s
