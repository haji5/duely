spring.application.name=bracket-battle-backend
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/bracket_battle}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool Configuration (optimized for Standard tier - 2GB RAM, 1 CPU)
# DB has 100 max connections, we use 30 to handle concurrent traffic efficiently
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:30}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:10}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.pool-name=BracketBattlePool

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false

# Liquibase
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

# Valkey Cache Configuration (Redis-compatible)
spring.data.redis.host=${VALKEY_HOST:localhost}
spring.data.redis.port=${VALKEY_PORT:6379}
spring.data.redis.password=${VALKEY_PASSWORD:}
spring.data.redis.timeout=2000ms
spring.data.redis.connect-timeout=2000ms
spring.data.redis.client-type=lettuce

# Valkey connection pool settings (Lettuce)
# Optimized for Valkey KV Starter (250 max connections)
# With 200 Tomcat threads, allocate more connections for cache operations
spring.data.redis.lettuce.pool.enabled=true
spring.data.redis.lettuce.pool.max-active=50
spring.data.redis.lettuce.pool.max-idle=30
spring.data.redis.lettuce.pool.min-idle=15
spring.data.redis.lettuce.pool.max-wait=2000ms
spring.data.redis.lettuce.shutdown-timeout=100ms

# Cache configuration
spring.cache.type=redis
spring.cache.redis.time-to-live=600000
spring.cache.redis.cache-null-values=false
spring.cache.redis.use-key-prefix=true
spring.cache.redis.key-prefix=bracket-battle:

# CORS
spring.web.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=Authorization,Cache-Control,Content-Type
spring.web.cors.allow-credentials=true

# Server
server.port=${SERVER_PORT:8080}
server.forward-headers-strategy=framework
server.max-http-request-header-size=16KB
server.tomcat.max-http-form-post-size=2MB
server.tomcat.max-swallow-size=2MB
# Optimized for 2GB RAM, 1 CPU
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=20
server.tomcat.max-connections=8192
server.tomcat.accept-count=100
server.tomcat.connection-timeout=20000

# Actuator
management.endpoints.web.exposure.include=health,info,caches
management.endpoint.health.probes.enabled=true
management.health.db.enabled=true
management.health.redis.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# Logging
logging.level.root=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=OFF
logging.level.com.bracketbattle=INFO
logging.level.com.bracketbattle.security.firebase=INFO
logging.level.org.springframework.cache=INFO
logging.level.org.springframework.data.redis=INFO

# Don't expose stack traces in responses
server.error.include-stacktrace=never
server.error.include-message=always
server.error.include-binding-errors=never

# Resilience4j Rate Limiter
resilience4j.ratelimiter.instances.resultSubmission.limit-for-period=5
resilience4j.ratelimiter.instances.resultSubmission.limit-refresh-period=60s
resilience4j.ratelimiter.instances.resultSubmission.timeout-duration=0s
resilience4j.ratelimiter.instances.resultSubmission.register-health-indicator=true
resilience4j.ratelimiter.instances.resultSubmission.event-consumer-buffer-size=100

# Read operations rate limiter (per IP)
ratelimiter.read.limit-for-period=${READ_RATE_LIMIT:100}
ratelimiter.read.limit-refresh-period=${READ_RATE_REFRESH_PERIOD:60}

# Bracket creation rate limiter (per user)
ratelimiter.bracket-creation.limit-for-period=${BRACKET_CREATION_LIMIT:10}
ratelimiter.bracket-creation.limit-refresh-period=${BRACKET_CREATION_REFRESH_PERIOD:3600}

# Item creation rate limiter (per user)
ratelimiter.item-creation.limit-for-period=${ITEM_CREATION_LIMIT:200}
ratelimiter.item-creation.limit-refresh-period=${ITEM_CREATION_REFRESH_PERIOD:3600}

