# Generous limits so ordinary tests never trip them; RateLimitIT lowers them on purpose.
app.rate-limit.buckets.read.limit=100000
app.rate-limit.buckets.result-user.limit=100000
app.rate-limit.buckets.result-ip.limit=100000
app.rate-limit.buckets.bracket-create.limit=100000
app.rate-limit.buckets.metadata-search.limit=100000
app.rate-limit.buckets.metadata-playlist.limit=100000
app.rate-limit.buckets.run-start-user.limit=100000
app.rate-limit.buckets.run-start-ip.limit=100000
app.rate-limit.buckets.counted-user.limit=100000
app.rate-limit.buckets.counted-ip.limit=100000
app.rate-limit.buckets.report.limit=100000
app.run-ticket.secret=test-run-ticket-secret-of-at-least-32-bytes
app.cors.allowed-origins=http://localhost:3000
app.public-base-url=https://duely.example
# As in production, so the test origin passes the same check.
app.require-public-origin=true
app.spa-index-url=classpath:spa-shell-fixture.html
# MockMvc has no second port: actuator shares the application's here.
management.server.port=8080
# Spring Boot's tests turn exporters off; these check what /actuator/prometheus shows.
management.prometheus.metrics.export.enabled=true
